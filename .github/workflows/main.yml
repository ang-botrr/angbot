name: rubika-bot

on:
  schedule:
    - cron: "*/20 * * * *"   # هر ۲۰ دقیقه
  workflow_dispatch:         # اجرای دستی از تب Actions

permissions:
  contents: write            # برای ذخیره state.json

concurrency:
  group: rubika-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py

      - name: Save state
        run: |
          git config user.name "rubika-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)

